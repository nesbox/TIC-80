name: Release PRO

# Build the paid PRO builds and push them straight to itch.io via butler.
# PRO binaries are never uploaded as GitHub artifacts — in a public repo
# artifacts are readable by anyone with the run id, which would leak the
# paid build. Instead each job builds PRO and pushes it in the same step, so
# the binary only ever lives on the ephemeral runner. Paid/free is set per
# file on the itch.io dashboard; the channels below carry the -pro suffix.

on:
  release:
    types: [published]
  # a dispatch retries a failed push for a tag; a re-run keeps the old workflow file
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and push (e.g. v1.4.0)'
        required: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows-pro:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          submodules: recursive
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6

      - name: Build PRO
        shell: cmd
        run: |
          cd build
          cmake -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release -DBUILD_PRO=On -DBUILD_WITH_ALL=ON ..
          cmake --build . --config Release --parallel

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        shell: bash
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "BUTLER_API_KEY is not set — refusing to report success for a push that never happened" >&2
            exit 1
          fi
          VER="${TAG#v}"
          curl -L -o butler.zip https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default
          unzip -q butler.zip
          # The layouts itch needs, explained in bin/release/stage-itch.sh:
          # one folder per channel, named without the version.
          mkdir -p stage/windows-pro
          cp build/bin/tic80.exe stage/windows-pro/tic80-win-pro.exe
          ./butler push stage/windows-pro nesbox/tic80:windows-pro --userversion "$VER"

  linux-pro:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          submodules: recursive
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12 libx11-dev libxi-dev libxcursor-dev libegl1-mesa-dev libgles2-mesa-dev libasound2-dev libpulse-dev libaudio-dev libsamplerate0-dev libcurl4-openssl-dev unzip
          sudo ln -s -f /usr/bin/gcc-12 /usr/bin/gcc
          sudo ln -s -f /usr/bin/g++-12 /usr/bin/g++

      - name: Build PRO
        run: |
          cd build
          # GLES3/EGL, as the free x64 and both arm64 builds.
          cmake -DCMAKE_BUILD_TYPE=Release -DUSE_GLES2=ON -DBUILD_PRO=On -DBUILD_WITH_ALL=ON ..
          cmake --build . --config Release --parallel

      - name: Build deb
        run: |
          VER="${TAG#v}"
          SHORT="${VER%.*}"
          bash bin/release/make-deb.sh build/bin out/tic80-v$SHORT-linux-pro.deb amd64 "$VER"

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "BUTLER_API_KEY is not set — refusing to report success for a push that never happened" >&2
            exit 1
          fi
          VER="${TAG#v}"
          SHORT="${VER%.*}"
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          # The layouts itch needs, explained in bin/release/stage-itch.sh:
          # the binary in a folder of its own, the package in another.
          mkdir -p stage/linux-pro stage/deb-amd64-pro
          cp build/bin/tic80 stage/linux-pro/tic80-linux-pro
          cp "out/tic80-v$SHORT-linux-pro.deb" stage/deb-amd64-pro/tic80-linux-pro.deb
          ./butler push stage/linux-pro nesbox/tic80:linux-pro --userversion "$VER"
          ./butler push stage/deb-amd64-pro nesbox/tic80:deb-amd64-pro --userversion "$VER"

  # The free pipeline has built linux-arm64 since 1.2.0 (the `linux-arm64`
  # job in build.yml), and the paid half never did:
  # `linux-pro` above is amd64-only, so the PRO arm64 pair was never built
  # rather than left unpushed (#3007). The runner and the toolchain mirror
  # that free job, because that combination is the one proven on arm64.
  linux-arm64-pro:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          submodules: recursive
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6

      - name: Install
        run: |
          # the google-chrome apt repo flakes with "Hash Sum mismatch"; drop it
          # (TIC-80 doesn't need it) so apt-get update can't fail on it.
          sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome* 2>/dev/null || true
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12 libx11-dev libxi-dev libxcursor-dev libglu1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libasound2-dev libpulse-dev libaudio-dev libsamplerate0-dev libcurl4-openssl-dev unzip
          sudo ln -s -f /usr/bin/gcc-12 /usr/bin/gcc
          sudo ln -s -f /usr/bin/g++-12 /usr/bin/g++
          # the generator the arm64 builds use; the image carries it already
          command -v ninja >/dev/null || sudo apt-get install -y ninja-build

      - name: Generate GLES/EGL stubs
        run: |
          for lib in /usr/lib/aarch64-linux-gnu/libGLESv2.so.2 /usr/lib/aarch64-linux-gnu/libEGL.so.1; do \
              outname=$(basename $lib | sed 's/-2.0//; s/\.so\..*/.so/') && \
              echo "Generating stubs for $outname from $lib" && \
              nm -D $lib | grep " T " | awk '{print "void " $3 "(){}"}' > stubs.c && \
              sudo rm -f /usr/lib/aarch64-linux-gnu/$outname && \
              soname=$(basename $lib | sed 's/-2.0//') && \
              sudo gcc -shared -Wl,-soname,$soname -o /usr/lib/aarch64-linux-gnu/$outname stubs.c; \
          done

      - name: Build PRO
        run: |
          cd build
          # GLES3/EGL, as in the free arm64 job: the Pis top out at GL 3.1.
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_GLES2=ON -DBUILD_PRO=On -DBUILD_WITH_ALL=ON ..
          cmake --build . --parallel

      - name: Build deb
        run: |
          VER="${TAG#v}"
          SHORT="${VER%.*}"
          bash bin/release/make-deb.sh build/bin out/tic80-v$SHORT-linux-arm64-pro.deb arm64 "$VER"

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "BUTLER_API_KEY is not set — refusing to report success for a push that never happened" >&2
            exit 1
          fi
          VER="${TAG#v}"
          SHORT="${VER%.*}"
          # butler for the runner's own architecture: the paid build never
          # leaves the runner (see the header), so the push happens here, and
          # the linux-amd64 butler the other jobs use cannot run on this image.
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-arm64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          # The layouts itch needs, explained in bin/release/stage-itch.sh:
          # the binary in a folder of its own, the package in another.
          mkdir -p stage/linux-arm64-pro stage/deb-arm64-pro
          cp build/bin/tic80 stage/linux-arm64-pro/tic80-linux-arm64-pro
          cp "out/tic80-v$SHORT-linux-arm64-pro.deb" stage/deb-arm64-pro/tic80-linux-arm64-pro.deb
          ./butler push stage/linux-arm64-pro nesbox/tic80:linux-arm64-pro --userversion "$VER"
          ./butler push stage/deb-arm64-pro nesbox/tic80:deb-arm64-pro --userversion "$VER"

  macos-arm64-pro:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          submodules: recursive
          fetch-depth: 0

      - name: Install
        run: brew uninstall --ignore-dependencies libidn2

      - name: Build PRO
        run: |
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_PRO=On -DBUILD_WITH_ALL=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..
          cmake --build . --parallel

      - name: Build dmg
        run: |
          VER="${TAG#v}"
          SHORT="${VER%.*}"
          bash bin/release/make-dmg.sh build/bin out "$VER" "$SHORT" "-arm64"

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "BUTLER_API_KEY is not set — refusing to report success for a push that never happened" >&2
            exit 1
          fi
          VER="${TAG#v}"
          SHORT="${VER%.*}"
          curl -L -o butler.zip https://broth.itch.zone/butler/darwin-arm64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          # The layouts itch needs, explained in bin/release/stage-itch.sh:
          # the bundle in a folder of its own, the package in another.
          mkdir -p stage/osx-arm64-pro stage/dmg-arm64-pro
          unzip -qo "out/tic80-v$SHORT-mac-arm64.app.zip" -d stage/osx-arm64-pro
          cp "out/tic80-v$SHORT-mac-arm64.dmg" stage/dmg-arm64-pro/tic80-mac-arm64-pro.dmg
          ./butler push stage/osx-arm64-pro nesbox/tic80:mac-arm64-pro --userversion "$VER"
          ./butler push stage/dmg-arm64-pro nesbox/tic80:dmg-arm64-pro --userversion "$VER"

  macos-intel-pro:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          submodules: recursive
          fetch-depth: 0

      - name: Install
        run: brew uninstall --ignore-dependencies libidn2

      - name: Build PRO
        run: |
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_PRO=On -DBUILD_WITH_ALL=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..
          cmake --build . --parallel

      - name: Build dmg
        run: |
          VER="${TAG#v}"
          SHORT="${VER%.*}"
          bash bin/release/make-dmg.sh build/bin out "$VER" "$SHORT" ""

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "BUTLER_API_KEY is not set — refusing to report success for a push that never happened" >&2
            exit 1
          fi
          VER="${TAG#v}"
          SHORT="${VER%.*}"
          curl -L -o butler.zip https://broth.itch.zone/butler/darwin-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          # The layouts itch needs (see the arm64 job above).
          mkdir -p stage/osx-pro stage/dmg-intel-pro
          unzip -qo "out/tic80-v$SHORT-mac.app.zip" -d stage/osx-pro
          cp "out/tic80-v$SHORT-mac.dmg" stage/dmg-intel-pro/tic80-mac-pro.dmg
          ./butler push stage/osx-pro nesbox/tic80:mac-pro --userversion "$VER"
          ./butler push stage/dmg-intel-pro nesbox/tic80:dmg-intel-pro --userversion "$VER"

  android-pro:
    # 24.04, not -latest: setup-ruby has no 2.6.10 for 26.04 (#3107).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          submodules: recursive
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0 platforms;android-31 ndk;30.0.16248370"

      - name: Build PRO
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export ANDROID_NDK="$ANDROID_HOME/ndk/30.0.16248370"

          # The signing passwords are repository secrets; apk.sh refuses to
          # sign without them, and a PRO build that never reached the signer
          # must not look like one that did.
          : "${RELEASE_STORE_PASSWORD:?RELEASE_STORE_PASSWORD secret is not set}"
          : "${RELEASE_KEY_PASSWORD:?RELEASE_KEY_PASSWORD secret is not set}"

          cmake -S . -B build-android-pro -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SOKOL=ON -DBUILD_SDL=OFF \
              -DBUILD_WITH_ALL=ON -DBUILD_TOUCH_INPUT=ON -DBUILD_PRO=ON
          cmake --build build-android-pro --parallel
          build/android-sokol/apk.sh build-android-pro/bin/libtic80.so build/android-sokol/tic80-pro.apk

      - name: Check the APK
        run: |
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)

          unzip -p build/android-sokol/tic80-pro.apk lib/arm64-v8a/libtic80.so > tic80-pro.so

          grep -qa "SPRITE EDITOR" tic80-pro.so || {
            echo "the APK has no editors — BUILD_EDITORS did not take" >&2
            exit 1
          }
          # TIC_VERSION_POST appends " Pro" only under TIC80_PRO.
          grep -qa " Pro (" tic80-pro.so || {
            echo "the APK is not a PRO build — BUILD_PRO did not take" >&2
            exit 1
          }
          unzip -l build/android-sokol/tic80-pro.apk | grep -q "classes.dex" && {
            echo "the APK carries a dex; the sokol APK is native only" >&2
            exit 1
          }

          "$TOOLS/aapt2" dump badging build/android-sokol/tic80-pro.apk | grep "^package:"
          "$TOOLS/aapt2" dump badging build/android-sokol/tic80-pro.apk | grep -q "package: name='com.nesbox.tic'" || {
            echo "the PRO APK has the wrong package id" >&2
            exit 1
          }
          "$TOOLS/aapt2" dump badging build/android-sokol/tic80-pro.apk | grep -q "minSdkVersion:'26'" || {
            echo "the PRO APK's minSdk is not 26" >&2
            exit 1
          }

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "BUTLER_API_KEY is not set — refusing to report success for a push that never happened" >&2
            exit 1
          fi
          VER="${TAG#v}"
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          # The layouts itch needs (see the windows job above).
          mkdir -p stage/android-pro
          cp build/android-sokol/tic80-pro.apk stage/android-pro/tic80-android-pro.apk
          ./butler push stage/android-pro nesbox/tic80:android-pro --userversion "$VER"

  # Free builds are assembled by release.yml (into the draft release); once
  # the release is published, push those assets to itch.io's free channels.
  itch-free:
    # 24.04, not -latest: the label moves to 26.04 (runner-images#14748).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo nesbox/TIC-80 --dir flat \
            --pattern 'tic80-v*-win.zip' \
            --pattern 'tic80-v*-linux.zip' \
            --pattern 'tic80-v*-linux.deb' \
            --pattern 'tic80-v*-linux-arm64.zip' \
            --pattern 'tic80-v*-linux-arm64.deb' \
            --pattern 'tic80-v*-mac.app.zip' \
            --pattern 'tic80-v*-mac.dmg' \
            --pattern 'tic80-v*-mac-arm64.app.zip' \
            --pattern 'tic80-v*-mac-arm64.dmg' \
            --pattern 'tic80-v*-android.apk' \
            --pattern 'tic80-v*-html.zip'

      - name: Stage the itch.io layouts
        run: |
          VER="${TAG#v}"
          bash bin/release/stage-itch.sh flat stage "$VER"

      - name: Push free builds to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "BUTLER_API_KEY is not set — refusing to report success for a push that never happened" >&2
            exit 1
          fi
          VER="${TAG#v}"
          SHORT="${VER%.*}"
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          butler/butler push stage/windows     nesbox/tic80:windows     --userversion "$VER"
          butler/butler push stage/linux       nesbox/tic80:linux       --userversion "$VER"
          butler/butler push stage/linux-arm64 nesbox/tic80:linux-arm64 --userversion "$VER"
          butler/butler push stage/osx         nesbox/tic80:mac         --userversion "$VER"
          butler/butler push stage/osx-arm64   nesbox/tic80:mac-arm64   --userversion "$VER"
          butler/butler push stage/android     nesbox/tic80:android     --userversion "$VER"
          butler/butler push stage/html        nesbox/tic80:html        --userversion "$VER"
          butler/butler push stage/deb-amd64   nesbox/tic80:deb-amd64   --userversion "$VER"
          butler/butler push stage/deb-arm64   nesbox/tic80:deb-arm64   --userversion "$VER"
          butler/butler push stage/dmg-intel   nesbox/tic80:dmg-intel   --userversion "$VER"
          butler/butler push stage/dmg-arm64   nesbox/tic80:dmg-arm64   --userversion "$VER"
