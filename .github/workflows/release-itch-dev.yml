name: Release itch dev

# Push a draft release's free assets to the hidden itch.io dev project
# (nesbox/tic80-dev) for testing. Runs manually; it never touches the public
# nesbox/tic80 project.
#
# Desktop builds go up as single files (exe/deb/dmg/apk) so the versioned
# filename survives — butler unpacks .zip and would drop the name. The web
# build goes up as a folder (index.html + tic80.js + tic80.wasm).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.2.0)'
        required: true

jobs:
  itch-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.version }}" --repo nesbox/TIC-80 --dir flat \
            --pattern 'tic80-v*-win.zip' \
            --pattern 'tic80-v*-linux.deb' \
            --pattern 'tic80-v*-linux-arm64.deb' \
            --pattern 'tic80-v*-mac.dmg' \
            --pattern 'tic80-v*-mac-arm64.dmg' \
            --pattern 'tic80-v*-android.apk' \
            --pattern 'tic80-v*-html.zip'

      - name: Stage single-file assets
        run: |
          VER="${VERSION#v}"
          SHORT="${VER%.*}"
          unzip -qo flat/tic80-v$SHORT-win.zip tic80.exe -d flat
          mv flat/tic80.exe flat/tic80-v$SHORT-win.exe
          mkdir -p html
          unzip -qo flat/tic80-v$SHORT-html.zip -d html
        env:
          VERSION: ${{ inputs.version }}

      - name: Push to itch.io dev project
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "BUTLER_API_KEY not set; skipping"; exit 0; fi
          VER="${VERSION#v}"
          SHORT="${VER%.*}"
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          butler/butler push flat/tic80-v$SHORT-win.exe       nesbox/tic80-dev:windows    --userversion "$VER"
          butler/butler push flat/tic80-v$SHORT-linux.deb     nesbox/tic80-dev:linux      --userversion "$VER"
          butler/butler push flat/tic80-v$SHORT-linux-arm64.deb nesbox/tic80-dev:linux-arm64 --userversion "$VER"
          butler/butler push flat/tic80-v$SHORT-mac.dmg       nesbox/tic80-dev:osx        --userversion "$VER"
          butler/butler push flat/tic80-v$SHORT-mac-arm64.dmg nesbox/tic80-dev:osx-arm64  --userversion "$VER"
          butler/butler push flat/tic80-v$SHORT-android.apk   nesbox/tic80-dev:android    --userversion "$VER"
          butler/butler push html                             nesbox/tic80-dev:html       --userversion "$VER"
