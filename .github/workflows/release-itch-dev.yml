name: Release itch dev

# Push a draft release's free assets to the hidden itch.io dev project
# (nesbox/tic80-dev) for testing. Runs manually; it never touches the public
# nesbox/tic80 project.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.2.0)'
        required: true

jobs:
  itch-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.version }}" --repo nesbox/TIC-80 --dir flat

      - name: Push free builds to itch.io dev project
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "BUTLER_API_KEY not set; skipping"; exit 0; fi
          VER="${VERSION#v}"
          SHORT="${VER%.*}"
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          butler/butler push flat/tic80-v$SHORT-win.zip      nesbox/tic80-dev:windows   --userversion "$VER"
          butler/butler push flat/tic80-v$SHORT-linux.zip    nesbox/tic80-dev:linux     --userversion "$VER"
          butler/butler push flat/tic80-v$SHORT-mac.zip      nesbox/tic80-dev:osx       --userversion "$VER"
          butler/butler push flat/tic80-v$SHORT-mac-arm64.zip nesbox/tic80-dev:osx-arm64 --userversion "$VER"
          butler/butler push flat/tic80-v$SHORT-android.apk  nesbox/tic80-dev:android   --userversion "$VER"
          butler/butler push flat/tic80-v$SHORT-html.zip     nesbox/tic80-dev:html      --userversion "$VER"
