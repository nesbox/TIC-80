name: Release

# Cut a release from a semver tag (v1.2.0). Reuses the build workflow for the
# raw binaries, packages them into the downloadable asset names, then creates a
# *draft* GitHub release (watchers are not notified until it is published) and
# pushes the free builds to itch.io via butler.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Package assets
        run: |
          VER="${GITHUB_REF_NAME#v}"
          SHORT="${VER%.*}"
          bash bin/release/package.sh artifacts out "$VER" "$SHORT"

      - uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: out/*

  dmg:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          name: tic80-macos-arm64
          path: artifacts/tic80-macos-arm64
      - uses: actions/download-artifact@v6
        with:
          name: tic80-macos
          path: artifacts/tic80-macos

      - name: Build dmgs
        run: |
          VER="${GITHUB_REF_NAME#v}"
          bash bin/release/make-dmg.sh artifacts/tic80-macos-arm64 out "$VER" "-arm64"
          bash bin/release/make-dmg.sh artifacts/tic80-macos out "$VER" ""

      - uses: actions/upload-artifact@v6
        with:
          name: tic80-mac-dmg
          path: out/*.dmg

  publish:
    needs: [package, dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release-assets
          path: flat
      - uses: actions/download-artifact@v6
        with:
          name: tic80-mac-dmg
          path: flat

      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: flat/*

      - name: Push to itch.io (butler)
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "BUTLER_API_KEY not set; skipping itch.io push"
            exit 0
          fi
          VER="${GITHUB_REF_NAME#v}"
          SHORT="${VER%.*}"
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          butler/butler push flat/tic80-v$SHORT-win.zip      nesbox/tic80:windows   --userversion "$VER"
          butler/butler push flat/tic80-v$SHORT-linux.zip    nesbox/tic80:linux     --userversion "$VER"
          butler/butler push flat/tic80-v$SHORT-mac.zip      nesbox/tic80:osx       --userversion "$VER"
          butler/butler push flat/tic80-v$SHORT-mac-arm64.zip nesbox/tic80:osx-arm64 --userversion "$VER"
          butler/butler push flat/tic80-v$SHORT-android.apk  nesbox/tic80:android   --userversion "$VER"
          butler/butler push flat/tic80-v$SHORT-html.zip     nesbox/tic80:html      --userversion "$VER"
