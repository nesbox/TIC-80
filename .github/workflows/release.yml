name: Release

# Cut a release from a semver tag (v1.2.0). Reuses the build workflow for the
# raw binaries, packages them into the downloadable asset names, then creates a
# *draft* GitHub release (watchers are not notified until it is published) and
# pushes the free builds to itch.io via butler.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    # The android job signs the APK with these, and a called workflow sees no
    # repository secrets it is not handed. Without this line the tag path —
    # the only path that goes through a call — builds every other platform
    # and fails android, so the draft never gets packaged (16.09).
    secrets:
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Package assets
        run: |
          VER="${GITHUB_REF_NAME#v}"
          SHORT="${VER%.*}"
          bash bin/release/package.sh artifacts out "$VER" "$SHORT"

      - uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: out/*

  dmg:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          name: tic80-macos-arm64
          path: artifacts/tic80-macos-arm64
      - uses: actions/download-artifact@v6
        with:
          name: tic80-macos
          path: artifacts/tic80-macos

      - name: Build dmgs and app bundles
        run: |
          VER="${GITHUB_REF_NAME#v}"
          SHORT="${VER%.*}"
          # make-dmg.sh writes both the dmg and the zipped .app bundle; the
          # bundle is what the itch.io jobs push for macOS.
          bash bin/release/make-dmg.sh artifacts/tic80-macos-arm64 out "$VER" "$SHORT" "-arm64"
          bash bin/release/make-dmg.sh artifacts/tic80-macos out "$VER" "$SHORT" ""

      - uses: actions/upload-artifact@v6
        with:
          # every other upload in the pipeline fails on an empty glob; this
          # one was the exception, so a glob that stopped matching would have
          # published a draft without the macOS assets and only then broken
          # stage-itch.sh, after the Windows and Linux channels were pushed
          if-no-files-found: error
          name: tic80-mac-pkg
          path: |
            out/*.dmg
            out/*.app.zip

  publish:
    needs: [package, dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v6
        with:
          name: release-assets
          path: flat
      - uses: actions/download-artifact@v6
        with:
          name: tic80-mac-pkg
          path: flat

      # A re-pushed tag runs the whole pipeline again, and the two steps below
      # must not touch a release that is already public: `draft: true` sends it
      # back to a draft and the notes step overwrites a body edited by hand.
      # Both happened on 1.2.0, and both were caught by cancelling the run by
      # hand — twice. A draft, or no release at all, is the ordinary path.
      #
      # The API is asked rather than `gh release view` because the HTTP status
      # is what this step branches on: a 404 is the only failure that means
      # "no release yet". Treating any failure that way — a 5xx, a token
      # without access — would let an unreachable API send a published release
      # back to a draft, which is the thing this guard exists to prevent, so
      # anything but a 404 stops the job.
      - name: Check what the tag's release is
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! body="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" 2>&1)"; then
            case "$body" in
              *"HTTP 404"*)
                echo "no release for $GITHUB_REF_NAME yet — the step below creates the draft"
                echo "published=false" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "::error::could not read the release for $GITHUB_REF_NAME: $body"
                exit 1
                ;;
            esac
          else
            # plain `.draft`, not `// empty`: jq's alternative operator treats
            # false as absent, and false is exactly the published case
            case "$(jq -r '.draft' <<<"$body" 2>/dev/null)" in
              true)
                echo "release $GITHUB_REF_NAME is a draft — refreshing its assets and notes"
                echo "published=false" >> "$GITHUB_OUTPUT"
                ;;
              false)
                echo "::warning::release $GITHUB_REF_NAME is published — leaving it untouched (no asset refresh, no notes rewrite); delete the release or bump the version to rebuild"
                echo "published=true" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "::error::unexpected release payload for $GITHUB_REF_NAME"
                exit 1
                ;;
            esac
          fi

      - name: Draft GitHub release
        if: steps.release_state.outputs.published != 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: flat/*

      - name: Generate release notes
        if: steps.release_state.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # The body is our readable summary followed by the list GitHub
          # generates for the same range (every pull request with its author,
          # the first-time contributors, the compare link) — the script writes
          # both, and one half failing never costs the other.
          #
          # Best-effort by design: an LLM outage, a missing key or a failed
          # API call must not wedge the release (the draft + assets already
          # exist above and cannot be recreated cleanly). The script exits
          # non-zero only when both halves are empty, and the draft then keeps
          # its default body.
          if bash bin/release/generate-notes.sh "$GITHUB_REF_NAME" > notes.md; then
            gh release edit "$GITHUB_REF_NAME" --repo nesbox/TIC-80 --notes-file notes.md
          else
            echo "note: release notes generation failed — leaving the default body"
          fi
