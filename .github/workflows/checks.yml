name: Checks

# The checks, apart from the workflow that produces the artifacts: build.yml
# is the matrix and the only workflow release.yml calls, so a release runs no
# check — a check produces no artifact, and a re-run of one on a tag could only
# fail a release, never inform it.
#
# The format job holds the tree to .clang-format, and leaves alone the files in
# .clang-format-ignore. The tidy job holds it to .clang-tidy: what the code
# does rather than how it reads. The tests job builds and runs what
# cmake/tests.cmake registers, the conformance runner among it. The bench job
# compares two builds of the drawing benchmark and reports the delta — a report,
# never a gate, and only when something that can move a draw call changed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6
        with:
          # The base of the diff can be an arbitrary number of commits back,
          # and a shallow clone does not carry it.
          fetch-depth: 0

      # Pinned: the apt packages for this runner stop nine releases short of
      # 20.1.6, and two clang-format versions do not agree on layout. The PyPI
      # wheel is the official build of exactly this version.
      - name: Install clang-format
        run: pip install clang-format==20.1.6

      - name: Check the files this change touches
        run: |
          set -euo pipefail

          # What to measure against: the branch a pull request targets, the
          # commit a push landed on, main for a manual run.
          case "${{ github.event_name }}" in
            pull_request)
              git fetch --no-tags origin "${{ github.base_ref }}"
              base="origin/${{ github.base_ref }}"
              ;;
            push)
              base="${{ github.event.before }}"
              ;;
            *)
              git fetch --no-tags origin main
              base="origin/main"
              ;;
          esac

          # A new branch has no commit to compare with; there is nothing to
          # hold it to yet.
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            echo "no usable base ($base): nothing to check"
            exit 0
          fi

          # An array, so that a path is a path whatever it holds — the file
          # list is the only place a name from the diff reaches a command.
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR \
            "$base...HEAD" -- '*.c' '*.h' '*.cpp' '*.hpp')

          if [ ${#files[@]} -eq 0 ]; then
            echo "no C sources in this change"
            exit 0
          fi

          printf '  %s\n' "${files[@]}"
          clang-format --version

          # Only the files the change touches, and only those .clang-format-ignore
          # leaves in: the generated shader headers and the third-party files
          # under src/ are nobody's to reformat here.
          if ! clang-format --dry-run --Werror "${files[@]}"; then
            echo "::error::clang-format 20.1.6 would rewrite the files above"
            echo
            echo "To match it locally:"
            echo "    pip install clang-format==20.1.6"
            echo "    clang-format -i <the files listed above>"
            exit 1
          fi

          echo "all formatted"

  tidy:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6
        with:
          # The compile database names the sources of every target, and the
          # submodules carry the headers they include.
          submodules: recursive

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6

      # Pinned as clang-format is pinned, and for the same reason: a check set
      # is a property of a version, and moving to another one is a change of
      # its own — the one that carries the fixes for what it reports. The PyPI
      # wheel for this line is 20.1.0 where clang-format's is 20.1.6, and it
      # ships the checker alone: the loop below is the runner.
      - name: Install clang-tidy
        run: pip install clang-tidy==20.1.0

      # sokol is parsed here, never linked, but parsing it on Linux is
      # compiling it far enough to need the headers CMake's Linux branch links
      # against: X11, Xi, Xcursor, GL and asound.
      - name: Install the headers sokol is parsed against
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev libasound2-dev
          command -v ninja >/dev/null || sudo apt-get install -y ninja-build

      # The options a real build uses, one platform layer as the tree allows:
      # sokol is the layer the browser and console builds take. A database that
      # leaves a unit unable to find its headers is worse than no checker at
      # all — such a unit is a compiler error, and clang-tidy fails on one
      # whatever .clang-tidy says.
      - name: Configure
        run: |
          cmake -B build-tidy -G Ninja \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TOUCH_INPUT=ON \
            -DBUILD_WITH_ALL=ON -DBUILD_TESTS=ON \
            -DBUILD_PRO=On -DBUILD_LIBRETRO=ON

      # mruby 4 generates its presym headers during the build; the checker
      # parses mruby.c, so they have to exist before the database is used.
      - name: Generate the mruby headers
        run: cmake --build build-tidy --target mruby_vendor

      - name: Run
        run: |
          set -euo pipefail

          # The project's own translation units: the vendored trees and src/ext
          # are nobody's to hold to this. The number printed below is the whole
          # of what is checked — the 3DS, Switch and baremetalpi sources need
          # SDKs a runner has not, the SDL layer is not the layer this
          # configuration takes, and draw_cache.c and python_outline.c need
          # build options it does not turn on.
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(jq -r '.[].file' build-tidy/compile_commands.json |
            sort -u | grep -E '/(src|tests)/' | grep -vE '/(vendor|src/ext)/')

          clang-tidy --version
          echo "${#files[@]} translation units"

          # One file a process — the analyzer is the slow half of this job —
          # and a non-zero exit from any of them fails the step.
          printf '%s\0' "${files[@]}" | xargs -0 -n1 -P "$(nproc)" \
            clang-tidy -p build-tidy --quiet --warnings-as-errors='*'

  # The suite cmake/tests.cmake registers, the conformance suite among it: one
  # static build with every language and no system layer, one headless run.
  # Every registered test that exits non-zero fails the job, and the conformance
  # runner exits non-zero on a red mark: the table is the report, and a
  # divergence is what the suite exists to catch.
  tests:
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      # mruby builds through a ruby rake, like the other linux jobs.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ccache-${{ github.job }}-

      - name: Build
        id: build
        run: |
          set -euo pipefail
          command -v ninja >/dev/null || sudo apt-get install -y ninja-build
          command -v ccache >/dev/null || sudo apt-get install -y ccache
          # No layer, the static runtime named rather than defaulted: the
          # configuration the conformance suite's spec asks for. The suite
          # builds on the core alone, so this job needs nothing installed
          # beyond the toolchain.
          cmake -B build-tests -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_STATIC=ON -DBUILD_WITH_ALL=ON \
            -DBUILD_SOKOL=OFF -DBUILD_TESTS=ON
          # The suite's own target, not `all`: the studio library would compile
          # the editors and the browser here, which is the artifact matrix's to
          # build, not the checks'.
          cmake --build build-tests --parallel --target tic80-tests

      # The table is markdown and comes from the runner's own invocation — the
      # ctest pass below prints a failing test's output and swallows a passing
      # one's — and pipefail keeps a red mark or a broken measurement red
      # through the tee.
      - name: Run the conformance suite
        run: |
          set -euo pipefail
          ./build-tests/bin/api-conformance tests/conformance/probes | tee -a "$GITHUB_STEP_SUMMARY"

      # The registration gate is the build alone: a red mark or a measurement
      # that broke above leaves the job red either way, and the rest of the
      # suite's results are still worth having in that run.
      - name: Run the registered tests
        # !cancelled(), not bare success(): a red conformance mark above must
        # not keep the rest of the suite from reporting.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ctest --test-dir build-tests --output-on-failure -E api-conformance

  # The drawing benchmark reports a delta, it never gates: the numbers come
  # from a shared runner, and a regression here is a finding, not a failure.
  # Both builds run on the same runner, so the comparison does not inherit
  # another machine. The base is a worktree of the commit the change is
  # measured against, and only the submodules tic80core needs are initialized.
  # One row per platform: a delta is only meaningful within one runner. The
  # web build takes its row through Emscripten and node, the same drawing code
  # the html player runs.
  bench:
    name: bench (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            generator: Ninja
          - name: macos
            os: macos-15
            generator: Ninja
          - name: windows
            os: windows-2022
            generator: Visual Studio 17 2022
            config: --config Release
            exe: .exe
          - name: wasm
            os: ubuntu-22.04
            generator: Ninja
            emscripten: true
            exe: .js

    runs-on: ${{ matrix.os }}
    continue-on-error: true
    # A benchmark that hangs is a finding too; this keeps it from eating the
    # runner for hours.
    timeout-minutes: 30
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - uses: actions/checkout@v6
        with:
          # The base commit can be an arbitrary number of commits back, and
          # the worktree needs the commit object.
          fetch-depth: 0

      - uses: emscripten-core/setup-emsdk@v15
        if: matrix.emscripten

      - name: Install the benchmark's tools
        if: matrix.name == 'linux' || matrix.name == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            command -v ninja >/dev/null || sudo apt-get install -y ninja-build
            command -v ccache >/dev/null || sudo apt-get install -y ccache
          else
            command -v ninja >/dev/null || brew install ninja
            command -v ccache >/dev/null || brew install ccache
          fi

      - name: ccache
        if: matrix.name == 'linux' || matrix.name == 'macos'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-bench-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-bench-${{ matrix.name }}-

      - name: Find the base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              # base.sha is the tip the PR was last evaluated against and can
              # lag the branch; the benchmark wants the branch's current tip.
              ref="${{ github.event.pull_request.base.ref }}"
              git fetch --no-tags origin "$ref"
              base=$(git rev-parse "origin/$ref")
              ;;
            push)
              base="${{ github.event.before }}"
              ;;
            *)
              git fetch --no-tags origin main
              base=origin/main
              ;;
          esac

          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "no usable base ($base): the head table will be printed alone"
            exit 0
          fi

          echo "usable=true" >> "$GITHUB_OUTPUT"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Should the benchmark run?
        id: paths
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.base.outputs.usable }}" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "${{ steps.base.outputs.sha }}...HEAD" -- \
              src/core src/tools.c src/tools.h src/tilesheet.c src/tilesheet.h \
              src/api.h src/defines.h tests/bench cmake CMakeLists.txt \
              .github/workflows/checks.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no drawing-related paths in this change"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize the submodules the core needs
        if: steps.paths.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for path in vendor/zip vendor/zlib vendor/libpng vendor/giflib vendor/blip-buf vendor/naett vendor/argparse vendor/dlfcn vendor/dirent; do
            git submodule update --init "$path"
          done

      - name: Build the head benchmark
        if: steps.paths.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          launcher=""
          if [ "${{ matrix.name }}" != "wasm" ] && [ "$RUNNER_OS" != "Windows" ]; then
            launcher="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi

          flags="-DCMAKE_BUILD_TYPE=Release -DBUILD_SOKOL=OFF -DBUILD_WITH_LUA=OFF -DBUILD_TESTS=ON"

          if [ "${{ matrix.name }}" = "wasm" ]; then
            emcmake cmake -B build-bench -G Ninja $flags
          else
            cmake -B build-bench -G "${{ matrix.generator }}" $launcher $flags
          fi

          cmake --build build-bench --parallel --target api-bench ${{ matrix.config }}

      - name: Build the base benchmark
        id: basebuild
        if: steps.paths.outputs.run == 'true' && steps.base.outputs.usable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git worktree add ../tic80-base "${{ steps.base.outputs.sha }}"
          for path in vendor/zip vendor/zlib vendor/libpng vendor/giflib vendor/blip-buf vendor/naett vendor/argparse vendor/dlfcn vendor/dirent; do
            git -C ../tic80-base submodule update --init "$path"
          done

          # A base tree that predates the benchmark has no target to build;
          # the head table is still worth printing.
          if ! grep -q "api-bench" ../tic80-base/cmake/tests.cmake; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the base tree has no api-bench target"
            exit 0
          fi

          launcher=""
          if [ "${{ matrix.name }}" != "wasm" ] && [ "$RUNNER_OS" != "Windows" ]; then
            launcher="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi

          flags="-DCMAKE_BUILD_TYPE=Release -DBUILD_SOKOL=OFF -DBUILD_WITH_LUA=OFF -DBUILD_TESTS=ON"

          if [ "${{ matrix.name }}" = "wasm" ]; then
            emcmake cmake -S ../tic80-base -B build-base -G Ninja $flags
          else
            cmake -S ../tic80-base -B build-base -G "${{ matrix.generator }}" $launcher $flags
          fi

          if cmake --build build-base --parallel --target api-bench ${{ matrix.config }}; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the base benchmark did not build; the head table will be printed alone"
          fi

      - name: Run the benchmark
        if: steps.paths.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          head="$GITHUB_WORKSPACE/build-bench/bin/api-bench${{ matrix.exe }}"
          base="$GITHUB_WORKSPACE/build-base/bin/api-bench${{ matrix.exe }}"
          runner=""
          if [ "${{ matrix.name }}" = "wasm" ]; then
            runner=node
          fi

          $runner "$head" > head-1.txt
          $runner "$head" > head-2.txt

          if [ "${{ steps.basebuild.outputs.have }}" = "true" ]; then
            $runner "$base" > base.txt
            $runner "$head" --compare base.txt | tee -a "$GITHUB_STEP_SUMMARY"

            # Two identical head runs are the noise floor: a delta below it
            # is not a result.
            $runner "$head" --compare head-1.txt > aa.txt
            noise=$(awk -F'|' '
              /^\|/ && $6 ~ /%/ { v=$6; gsub(/[^0-9.-]/, "", v); if(v<0)v=-v; if(v>m)m=v }
              END { printf "%.1f", m }' aa.txt)
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "A/A noise: the largest per-row difference between two identical head runs is ±${noise}%." >> "$GITHUB_STEP_SUMMARY"
          else
            $runner "$head" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No base benchmark: the head table is above." >> "$GITHUB_STEP_SUMMARY"
          fi
