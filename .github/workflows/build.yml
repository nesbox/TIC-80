  # === Android ===
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r23
          add-to-path: false
          local-cache: true

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install 32-bit build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Build
        run: |
          cd build/android
          chmod +x gradlew
          # The signing passwords are repository secrets — the keystore path
          # and alias live in gradle.properties, the passwords never do. Fail
          # here rather than inside the signer: without them the release build
          # stops, and a step that produced no APK must not look like one that
          # produced a good one.
          #
          # A pull request from a fork is handed no secrets at all, so the two
          # checks below would fail it for a reason that has nothing to do with
          # the change (17.09). Such a run builds the release variant unsigned
          # instead: the android job still proves the code compiles, the APK
          # cannot be mistaken for a shipable one, and every other event — a
          # push, the tag call — signs exactly as before.
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
              ./gradlew assembleRelease -PUNSIGNED=1
              cp app/build/outputs/apk/release/app-release-unsigned.apk tic80.apk
              echo "fork pull request: no repository secrets, the APK is unsigned"
          else
              : "${RELEASE_STORE_PASSWORD:?RELEASE_STORE_PASSWORD secret is not set}"
              : "${RELEASE_KEY_PASSWORD:?RELEASE_KEY_PASSWORD secret is not set}"
              ./gradlew assembleRelease
              cp app/build/outputs/apk/release/app-release.apk tic80.apk
          fi

        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Deploy
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-android"
          path: build/android/tic80.apk

  # === HTML ===
  html:
    runs-on: ubuntu-latest

    steps:
      - uses: emscripten-core/setup-emsdk@v15

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6

      - name: Install 32-bit build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      # The per-language builds below are the PRO alone export stubs, so they
      # carry no editors, the way the native per-language stubs don't: an
      # exported game that opens the IDE on ESC is not the standalone the
      # alone export promises. "Build all" is a different thing — it is the
      # site's player, and the universal stub every free export downloads —
      # so it keeps its editors.

      # The two builds are split by trigger, not by job: the stubs run on a
      # tag or a dispatch like the native loops, the player always. Nothing
      # but a release reads the per-language wasm out of this artifact —
      # package.sh, which release.yml runs on a tag, is the only consumer,
      # and the dev flow takes the player's three files.

      # The twelve per-language stubs the PRO alone export downloads — the same
      # work as the native jobs' loop, in one directory: no --fresh between the
      # builds, so SDL2 and whatever a language does not touch are compiled
      # once (thirteen full builds used to run here, one per language plus the
      # one below). Every language flag is spelled out on every pass, which is
      # what --fresh used to buy, and it also clears the BUILD_WITH_ALL the
      # "Build all" step leaves on when the order is reversed.
      #
      # About seven minutes of emscripten for artifacts only a release uses:
      # every push used to pay that. The gate cannot change what a release
      # builds — on a tag these steps run in the same order as before — it
      # only keeps a branch or a pull request from paying for them.
      - name: Build per-language export stubs
        if: startsWith(github.ref, 'refs/tags/') || inputs.stubs
        shell: bash
        run: |
          set -euo pipefail
          langs=(lua ruby js moon yue fennel scheme squirrel wren wasm janet python miniscript forth)
          for lang in "${langs[@]}"; do
            flags=(-DBUILD_WITH_ALL=OFF)
            for l in "${langs[@]}"; do
              up=$(echo "$l" | tr '[:lower:]' '[:upper:]')
              if [ "$l" = "$lang" ]; then flags+=("-DBUILD_WITH_$up=ON"); else flags+=("-DBUILD_WITH_$up=OFF"); fi
            done
            cd "$GITHUB_WORKSPACE/build"
            emcmake cmake -G Ninja -DBUILD_SDLGPU=On -DCMAKE_BUILD_TYPE=Release -DBUILD_EDITORS=OFF "${flags[@]}" -DTIC80_TARGET="tic80$lang" ..
            cmake --build . --parallel
          done

          # An identical pair means a language flag did not take, the same guard
          # the native jobs run on their binaries: a wasm stub carries one
          # runtime, so twelve of them cannot be alike.
          files=("$GITHUB_WORKSPACE"/build/bin/tic80{lua,ruby,js,moon,yue,fennel,scheme,squirrel,wren,wasm,janet,python,miniscript,forth}.wasm)
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then echo "missing stub: $f" >&2; exit 1; fi
          done
          for ((i = 0; i < ${#files[@]}; i++)); do
            for ((j = i + 1; j < ${#files[@]}; j++)); do
              if cmp -s "${files[i]}" "${files[j]}"; then
                echo "duplicate stub: $(basename "${files[i]}") == $(basename "${files[j]}") — a language flag did not take" >&2
                exit 1
              fi
            done
          done
          echo "checked ${#files[@]} wasm stubs, all distinct"

      - name: Build all
        run: |
          cd build
          emcmake cmake -G Ninja -DBUILD_SDLGPU=On -DBUILD_STATIC=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_ALL=ON .. --fresh
          cmake --build . --parallel
          # index.html is the only page: the site's player, and the page an
          # exported game gets — the client fetches it, rewrites the title
          # and the arguments marker, and adds it to the export zip with the
          # cartridge (console.c onHtmlPageGet). A second, export-only page
          # used to exist and drifted from this one.
          cp html/index.html bin/index.html

      - name: Deploy
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-html"
          path: |
            build/bin/*
