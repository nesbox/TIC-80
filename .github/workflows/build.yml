            done
            cd "$GITHUB_WORKSPACE/build"
            cmake -G Ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DBUILD_SDLGPU=On -DBUILD_STATIC=ON -DBUILD_EDITORS=OFF "${flags[@]}" -DTIC80_TARGET="tic80$lang" ..
            cmake --build . --parallel
