name: Build

on:
  # main and pull requests, not every branch: pushing a branch and then opening
  # a pull request for it built the same commit twice, and the two runs do not
  # share a concurrency group (a push ref and a pull request ref are different),
  # so neither cancelled the other — 18 checks on one commit, for nine jobs.
  # A branch with no pull request yet still builds on demand, through the
  # dispatch below, and the release path comes in through `workflow_call`.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      stubs:
        description: 'Build the per-language export stubs too (slow; the release matrix)'
        type: boolean
        default: false
  workflow_call:
    # The android job signs the release APK with these. A reusable workflow
    # receives no repository secrets unless its caller names them, so
    # release.yml has to pass them — and `required` makes a caller that does
    # not fail at the start of the run instead of inside the signing step.
    # Before 15.09 the passwords lived in the tree and reached every flavor
    # of this workflow alike; moving them into secrets cut the tag path off,
    # because that path is the only one that goes through a call.
    secrets:
      RELEASE_STORE_PASSWORD:
        required: true
      RELEASE_KEY_PASSWORD:
        required: true

# A new push supersedes the previous run on the same ref: cancel it instead
# of burning matrix runners on stale commits.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # === Windows ===
  windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply Lua TIC-80 patches
        shell: bash
        run: |
          set -euo pipefail
          git apply build/lua5.4.patch

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6

      - name: Build
        shell: cmd
        run: |
          cd build
          cmake -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_ALL=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..
          cmake --build . --config Release --parallel || exit /b 1
          rem The universal export stub is this same binary (console.c appends
          rem the cart to it), so keep it before Build Pro overwrites it below.
          rem It goes into a directory of its own: upload-artifact names the file
          rem in the artifact by its basename, and package.sh looks for tic80.exe
          rem in there — a file called tic80-export.exe would fail packaging.
          if not exist "%GITHUB_WORKSPACE%\stub" mkdir "%GITHUB_WORKSPACE%\stub"
          copy /Y bin\tic80.exe "%GITHUB_WORKSPACE%\stub\tic80.exe" || exit /b 1

      - name: Deploy
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-windows"
          path: |
            build/bin/tic80.exe

      - name: Build Pro
        shell: cmd
        run: |
          cd build
          cmake -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release -DBUILD_PRO=On -DBUILD_WITH_ALL=ON ..
          cmake --build . --config Release --parallel

      # The universal stub: every free export asks for /export/<ver>/<system>,
      # with no language suffix. It keeps its editors, as it did in 1.1 — a
      # free export hands out the player, and it is `alone` (the per-language
      # stubs below) that strips the IDE.
      # No build here: the universal stub is the binary the Build step kept
      # aside — the same configuration, and building it again was a full engine
      # build for a byte-identical result.
      - name: Deploy Export Stub
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-windows-export"
          path: |
            stub/tic80.exe

      # The per-language stubs a PRO alone export asks for
      # (/export/<ver>/<system><lang>, console.c exportGame): one binary per
      # language, each carrying only that runtime — about a third of the
      # universal stub's size. This is a full engine build per language, so
      # it runs on the release path only (a tag, or a manual dispatch with
      # `stubs`) and never on a pull request.
      - name: Build per-language export stubs
        if: startsWith(github.ref, 'refs/tags/') || inputs.stubs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/stubs"
          langs=(lua ruby js moon yue fennel scheme squirrel wren wasm janet python miniscript forth gravity)
          for lang in "${langs[@]}"; do
            # Every language flag on every pass, so nothing can stick in the
            # cache from the previous one — which is what the --fresh here used
            # to buy, at the price of throwing SDL2 and the whole engine away
            # fifteen times over. Without it a pass rebuilds only what its
            # language actually changed (measured on this tree: 44 build steps
            # against 390 for a full one). BUILD_PRO is spelled out because the
            # Build Pro step above leaves it on in this same build directory.
            flags=(-DBUILD_WITH_ALL=OFF -DBUILD_PRO=OFF)
            for l in "${langs[@]}"; do
              up=$(echo "$l" | tr '[:lower:]' '[:upper:]')
              if [ "$l" = "$lang" ]; then flags+=("-DBUILD_WITH_$up=ON"); else flags+=("-DBUILD_WITH_$up=OFF"); fi
            done
            cd "$GITHUB_WORKSPACE/build"
            cmake -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release -DBUILD_EDITORS=OFF -DBUILD_SURF=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 "${flags[@]}" -DTIC80_TARGET="tic80$lang" ..
            cmake --build . --config Release --parallel
            cp "$GITHUB_WORKSPACE/build/bin/tic80$lang.exe" "$GITHUB_WORKSPACE/stubs/"
          done

          # One build per language, so one binary per language: an identical
          # pair means a flag did not take (a misspelled -DBUILD_WITH_<LANG>
          # yields a runtime-less engine that still looks fine to `[ -f ]`).
          # pairwise cmp, not an associative array: the macOS runners still
          # have bash 3.2, where `declare -A` is an invalid option and fails
          # the step (which is how the first version of this guard behaved)
          files=("$GITHUB_WORKSPACE"/stubs/*)
          if [ ${#files[@]} -ne ${#langs[@]} ]; then
            echo "expected ${#langs[@]} stubs, found ${#files[@]}" >&2
            exit 1
          fi
          for ((i = 0; i < ${#files[@]}; i++)); do
            for ((j = i + 1; j < ${#files[@]}; j++)); do
              if cmp -s "${files[i]}" "${files[j]}"; then
                echo "duplicate stub: $(basename "${files[i]}") == $(basename "${files[j]}") — a language flag did not take" >&2
                exit 1
              fi
            done
          done
          echo "checked ${#files[@]} stubs, all distinct"

      - name: Deploy per-language export stubs
        if: startsWith(github.ref, 'refs/tags/') || inputs.stubs
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-windows-export-langs"
          path: |
            stubs/*

  # === Ubuntu 22.04 (gcc-12, glibc 2.35) ===
  linux:
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply Lua TIC-80 patches
        run: |
          set -euo pipefail
          git apply build/lua5.4.patch

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6

      - name: Install
        run: |
          # the google-chrome apt repo flakes with "Hash Sum mismatch"; drop it
          # (TIC-80 doesn't need it) so apt-get update can't fail on it.
          sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome* 2>/dev/null || true
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update
          # The X11 trio and the GLES pair are sokol_app's link line and ALSA is
          # sokol_audio's; the rest is what the studio itself needs.
          sudo apt-get install gcc-12 g++-12 libx11-dev libxi-dev libxcursor-dev libegl1-mesa-dev libgles2-mesa-dev libasound2-dev libpulse-dev libaudio-dev libsamplerate0-dev libcurl4-openssl-dev -y
          sudo ln -s -f /usr/bin/gcc-12 /usr/bin/gcc
          sudo ln -s -f /usr/bin/g++-12 /usr/bin/g++
          # the generator the builds use; the image carries it already
          command -v ninja >/dev/null || sudo apt-get install -y ninja-build
          command -v ccache >/dev/null || sudo apt-get install -y ccache

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          # restore-keys match by prefix, and `linux-` is a prefix of `linux-arm64-`:
          # the arch keeps this job from restoring the arm64 cache.
          key: ccache-${{ github.job }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ github.job }}-${{ runner.arch }}-

      - name: Build
        run: |
          cd build
          # GLES3/EGL, as the arm64 builds: sokol's desktop GL backend asks for
          # an OpenGL 4.3 core context, which older machines cannot give it.
          cmake -G Ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DUSE_GLES2=ON -DBUILD_WITH_ALL=ON ..
          cmake --build . --parallel
          # The universal export stub is this same binary (console.c appends the
          # cart to it), so keep it before Build Pro overwrites it below. It goes
          # into a directory of its own: upload-artifact names the file in the
          # artifact by its basename, and package.sh looks for a file called
          # tic80 in there — one called tic80-export would fail packaging.
          mkdir -p "$GITHUB_WORKSPACE/stub"
          cp bin/tic80 "$GITHUB_WORKSPACE/stub/tic80"

      - name: Export help (learn.md)
        run: |
          cd build
          ./bin/tic80 --cli --fs=. --cmd='export help learn.md'
          mv learn.md ../learn.md

      - name: Deploy learn.md
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-learn"
          path: learn.md

      - name: Deploy
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-linux"
          path: |
            build/bin/tic80

      - name: Build Pro
        run: |
          cd build
          cmake -G Ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DUSE_GLES2=ON -DBUILD_PRO=On -DBUILD_WITH_ALL=ON ..
          cmake --build . --parallel

      # No build here: the universal stub is the binary the Build step kept
      # aside — the same configuration, and building it again was a full engine
      # build for a byte-identical result.
      - name: Deploy Export Stub
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-linux-export"
          path: |
            stub/tic80

      # The per-language stubs a PRO alone export asks for
      # (/export/<ver>/<system><lang>, console.c exportGame): one binary per
      # language, each carrying only that runtime — about a third of the
      # universal stub's size. This is a full engine build per language, so
      # it runs on the release path only (a tag, or a manual dispatch with
      # `stubs`) and never on a pull request.
      - name: Build per-language export stubs
        if: startsWith(github.ref, 'refs/tags/') || inputs.stubs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/stubs"
          langs=(lua ruby js moon yue fennel scheme squirrel wren wasm janet python miniscript forth gravity)
          for lang in "${langs[@]}"; do
            # Every language flag on every pass, so nothing can stick in the
            # cache from the previous one — which is what the --fresh here used
            # to buy, at the price of throwing SDL2 and the whole engine away
            # fifteen times over. Without it a pass rebuilds only what its
            # language actually changed (measured on this tree: 44 build steps
            # against 390 for a full one). BUILD_PRO is spelled out because the
            # Build Pro step above leaves it on in this same build directory.
            flags=(-DBUILD_WITH_ALL=OFF -DBUILD_PRO=OFF)
            for l in "${langs[@]}"; do
              up=$(echo "$l" | tr '[:lower:]' '[:upper:]')
              if [ "$l" = "$lang" ]; then flags+=("-DBUILD_WITH_$up=ON"); else flags+=("-DBUILD_WITH_$up=OFF"); fi
            done
            cd "$GITHUB_WORKSPACE/build"
            cmake -G Ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DBUILD_EDITORS=OFF -DBUILD_SURF=OFF "${flags[@]}" -DTIC80_TARGET="tic80$lang" ..
            cmake --build . --parallel
            cp "$GITHUB_WORKSPACE/build/bin/tic80$lang" "$GITHUB_WORKSPACE/stubs/"
          done

          # One build per language, so one binary per language: an identical
          # pair means a flag did not take (a misspelled -DBUILD_WITH_<LANG>
          # yields a runtime-less engine that still looks fine to `[ -f ]`).
          # pairwise cmp, not an associative array: the macOS runners still
          # have bash 3.2, where `declare -A` is an invalid option and fails
          # the step (which is how the first version of this guard behaved)
          files=("$GITHUB_WORKSPACE"/stubs/*)
          if [ ${#files[@]} -ne ${#langs[@]} ]; then
            echo "expected ${#langs[@]} stubs, found ${#files[@]}" >&2
            exit 1
          fi
          for ((i = 0; i < ${#files[@]}; i++)); do
            for ((j = i + 1; j < ${#files[@]}; j++)); do
              if cmp -s "${files[i]}" "${files[j]}"; then
                echo "duplicate stub: $(basename "${files[i]}") == $(basename "${files[j]}") — a language flag did not take" >&2
                exit 1
              fi
            done
          done
          echo "checked ${#files[@]} stubs, all distinct"

      - name: Deploy per-language export stubs
        if: startsWith(github.ref, 'refs/tags/') || inputs.stubs
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-linux-export-langs"
          path: |
            stubs/*

  # === Ubuntu 22.04 arm64 (gcc-12, glibc 2.35) ===

  linux-arm64:
    runs-on: ubuntu-22.04-arm
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply Lua TIC-80 patches
        run: |
          set -euo pipefail
          git apply build/lua5.4.patch

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6

      - name: Install
        run: |
          # the google-chrome apt repo flakes with "Hash Sum mismatch"; drop it
          # (TIC-80 doesn't need it) so apt-get update can't fail on it.
          sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome* 2>/dev/null || true
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update
          # The X11 trio and the GLES pair are sokol_app's link line and ALSA is
          # sokol_audio's; the rest is what the studio itself needs.
          sudo apt-get install gcc-12 g++-12 libx11-dev libxi-dev libxcursor-dev libglu1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libasound2-dev libpulse-dev libaudio-dev libsamplerate0-dev libcurl4-openssl-dev -y
          sudo ln -s -f /usr/bin/gcc-12 /usr/bin/gcc
          sudo ln -s -f /usr/bin/g++-12 /usr/bin/g++
          # the generator the builds use; the image carries it already
          command -v ninja >/dev/null || sudo apt-get install -y ninja-build
          command -v ccache >/dev/null || sudo apt-get install -y ccache

      - name: Generate GLES/EGL stubs
        run: |
          for lib in /usr/lib/aarch64-linux-gnu/libGLESv2.so.2 /usr/lib/aarch64-linux-gnu/libEGL.so.1; do \
              outname=$(basename $lib | sed 's/-2.0//; s/\.so\..*/.so/') && \
              echo "Generating stubs for $outname from $lib" && \
              nm -D $lib | grep " T " | awk '{print "void " $3 "(){}"}' > stubs.c && \
              sudo rm -f /usr/lib/aarch64-linux-gnu/$outname && \
              soname=$(basename $lib | sed 's/-2.0//') && \
              sudo gcc -shared -Wl,-soname,$soname -o /usr/lib/aarch64-linux-gnu/$outname stubs.c; \
          done

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ github.job }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ github.job }}-${{ runner.arch }}-

      - name: Build
        run: |
          cd build
          # GLES3/EGL, not desktop GL: sokol asks for an OpenGL 4.3 core
          # context, while the Pis this artifact serves top out at 3.1 (#3147).
          cmake -G Ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DUSE_GLES2=ON -DBUILD_WITH_ALL=ON ..
          cmake --build . --parallel
          # The universal export stub is this same binary (console.c appends the
          # cart to it), so keep it before Build Pro overwrites it below. It goes
          # into a directory of its own: upload-artifact names the file in the
          # artifact by its basename, and package.sh looks for a file called
          # tic80 in there — one called tic80-export would fail packaging.
          mkdir -p "$GITHUB_WORKSPACE/stub"
          cp bin/tic80 "$GITHUB_WORKSPACE/stub/tic80"

      - name: Deploy
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-linux-arm64"
          path: |
            build/bin/tic80

      - name: Build Pro
        run: |
          cd build
          cmake -G Ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DUSE_GLES2=ON -DBUILD_PRO=On -DBUILD_WITH_ALL=ON ..
          cmake --build . --parallel

      # No build here: the universal stub is the binary the Build step kept
      # aside — the same configuration, and building it again was a full engine
      # build for a byte-identical result.
      - name: Deploy Export Stub
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-linux-arm64-export"
          path: |
            stub/tic80

      # The per-language stubs a PRO alone export asks for
      # (/export/<ver>/<system><lang>, console.c exportGame): one binary per
      # language, each carrying only that runtime — about a third of the
      # universal stub's size. This is a full engine build per language, so
      # it runs on the release path only (a tag, or a manual dispatch with
      # `stubs`) and never on a pull request.
      - name: Build per-language export stubs
        if: startsWith(github.ref, 'refs/tags/') || inputs.stubs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/stubs"
          langs=(lua ruby js moon yue fennel scheme squirrel wren wasm janet python miniscript forth gravity)
          for lang in "${langs[@]}"; do
            # Every language flag on every pass, so nothing can stick in the
            # cache from the previous one — which is what the --fresh here used
            # to buy, at the price of throwing SDL2 and the whole engine away
            # fifteen times over. Without it a pass rebuilds only what its
            # language actually changed (measured on this tree: 44 build steps
            # against 390 for a full one). BUILD_PRO is spelled out because the
            # Build Pro step above leaves it on in this same build directory.
            flags=(-DBUILD_WITH_ALL=OFF -DBUILD_PRO=OFF)
            for l in "${langs[@]}"; do
              up=$(echo "$l" | tr '[:lower:]' '[:upper:]')
              if [ "$l" = "$lang" ]; then flags+=("-DBUILD_WITH_$up=ON"); else flags+=("-DBUILD_WITH_$up=OFF"); fi
            done
            cd "$GITHUB_WORKSPACE/build"
            cmake -G Ninja -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DBUILD_EDITORS=OFF -DBUILD_SURF=OFF "${flags[@]}" -DTIC80_TARGET="tic80$lang" ..
            cmake --build . --parallel
            cp "$GITHUB_WORKSPACE/build/bin/tic80$lang" "$GITHUB_WORKSPACE/stubs/"
          done

          # One build per language, so one binary per language: an identical
          # pair means a flag did not take (a misspelled -DBUILD_WITH_<LANG>
          # yields a runtime-less engine that still looks fine to `[ -f ]`).
          # pairwise cmp, not an associative array: the macOS runners still
          # have bash 3.2, where `declare -A` is an invalid option and fails
          # the step (which is how the first version of this guard behaved)
          files=("$GITHUB_WORKSPACE"/stubs/*)
          if [ ${#files[@]} -ne ${#langs[@]} ]; then
            echo "expected ${#langs[@]} stubs, found ${#files[@]}" >&2
            exit 1
          fi
          for ((i = 0; i < ${#files[@]}; i++)); do
            for ((j = i + 1; j < ${#files[@]}; j++)); do
              if cmp -s "${files[i]}" "${files[j]}"; then
                echo "duplicate stub: $(basename "${files[i]}") == $(basename "${files[j]}") — a language flag did not take" >&2
                exit 1
              fi
            done
          done
          echo "checked ${#files[@]} stubs, all distinct"

      - name: Deploy per-language export stubs
        if: startsWith(github.ref, 'refs/tags/') || inputs.stubs
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-linux-arm64-export-langs"
          path: |
            stubs/*

  # === Ubuntu-arm64 system GLES ===
  #
  # An ARM build against a system GLES (Batocera's data path is below). It
  # followed the desktop onto sokol, whose GLES backend needs a GLES 3 context —
  # where the SDL path this job built was a GLES 2 one.

  linux-arm64-gles:
    runs-on: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply Lua TIC-80 patches
        run: |
          set -euo pipefail
          git apply build/lua5.4.patch

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          # The GLES pair is stubbed below and the X11 trio and ALSA are what
          # sokol_app and sokol_audio link against, as in the shipping job.
          sudo apt-get install -y gcc g++ xz-utils wget python3 rake pkg-config binutils libgles2-mesa-dev libegl1-mesa-dev libx11-dev libxi-dev libxcursor-dev libasound2-dev

      - name: Generate Stubs
        run: |
          for lib in /usr/lib/aarch64-linux-gnu/libGLESv2.so.2 /usr/lib/aarch64-linux-gnu/libEGL.so.1; do \
              outname=$(basename $lib | sed 's/-2.0//; s/\.so\..*/.so/') && \
              echo "Generating stubs for $outname from $lib" && \
              nm -D $lib | grep " T " | awk '{print "void " $3 "(){}"}' > stubs.c && \
              sudo rm -f /usr/lib/aarch64-linux-gnu/$outname && \
              soname=$(basename $lib | sed 's/-2.0//') && \
              sudo gcc -shared -Wl,-soname,$soname -o /usr/lib/aarch64-linux-gnu/$outname stubs.c; \
          done

      - name: Build
        run: |
          cd build/linux
          cmake ../.. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_PRO=OFF \
            -DBUILD_WITH_ALL=ON \
            -DCMAKE_C_FLAGS_RELEASE="-Ofast -flto" \
            -DCMAKE_CXX_FLAGS_RELEASE="-Ofast -flto" \
            -DUSE_GLES2=ON \
            -DBUILD_EDITORS=OFF \
            -DBUILD_SURF=OFF \
            -DTIC_DATA_PATH="/userdata/roms/tic80/"
          cmake --build . --target tic80 --config Release --parallel

      - name: Pack
        run: |
          mkdir -p build/linux/share/applications
          mkdir -p build/linux/share/mime/packages
          mkdir -p build/linux/share/icons
          cp build/linux/tic80.desktop build/linux/share/applications/
          cp build/linux/tic80.xml build/linux/share/mime/packages/
          cp build/linux/tic80.png build/linux/share/icons/

      - name: Deploy
        uses: actions/upload-artifact@v6
        with:
          name: "tic80-linux-arm64-gles"
          path: |
            build/linux/bin/tic80
            build/linux/bin/*.so
            build/linux/lib/*.so
            build/linux/share/*

  # === Nintendo 3DS build ===

  nintendo-3ds:
    # 24.04, not -latest: the label moves to 26.04 (runner-images#14748).
    runs-on: ubuntu-24.04
    container: devkitpro/devkitarm:20250728

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply Lua TIC-80 patches
        run: |
          set -euo pipefail
          git apply build/lua5.4.patch

      - name: Install Host toolchain
        run: |
          apt-get update
          apt-get install --assume-yes build-essential gcc-multilib ruby-full

      - name: Build
        run: |
          CFLAGS="-w -DLUA_32BITS" CXXFLAGS="-w -DLUA_32BITS" cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/3DS.cmake \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_ALL=ON \
            -DBUILD_WITH_SCHEME=OFF -DBUILD_WITH_JS=OFF -DBUILD_WITH_PYTHON=OFF -DBUILD_WITH_YUE=OFF
          cmake --build build --parallel

      - name: Deploy
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-nintendo-3ds"
          path: build/bin/tic80.3dsx

  # === Nintendo Switch build ===
  nintendo-switch:
    # 24.04, not -latest: the label moves to 26.04 (runner-images#14748).
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:20250728

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply Lua TIC-80 patches
        run: |
          set -euo pipefail
          git apply build/lua5.4.patch

      - name: Install Host toolchain
        run: |
          apt-get update
          apt-get install --assume-yes build-essential gcc-multilib ruby-full

      - name: Build
        run: |
          cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_ALL=ON -DBUILD_SDLGPU=ON \
            -DBUILD_TOUCH_INPUT=ON \
            -DBUILD_WITH_YUE=OFF
          cmake --build build --parallel

      - name: Deploy
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-nintendo-switch"
          path: build/bin/tic80.nro

  # === MacOS 15 / arm64 ===
  macos-arm64:
    runs-on: macos-15
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply Lua TIC-80 patches
        run: |
          set -euo pipefail
          git apply build/lua5.4.patch

      - name: Install
        run: |
          brew uninstall --ignore-dependencies libidn2
          # the generator the builds use; the image usually carries it already
          command -v ninja >/dev/null || brew install ninja
          command -v ccache >/dev/null || brew install ccache
