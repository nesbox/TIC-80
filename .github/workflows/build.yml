  # === Android ===
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r23
          add-to-path: false
          local-cache: true

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install 32-bit build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Build
        run: |
          cd build/android
          chmod +x gradlew
          # The signing passwords are repository secrets — the keystore path
          # and alias live in gradle.properties, the passwords never do. Fail
          # here rather than inside the signer: without them the release build
          # stops, and a step that produced no APK must not look like one that
          # produced a good one.
          #
          # A pull request from a fork is handed no secrets at all, so the two
          # checks below would fail it for a reason that has nothing to do with
          # the change (17.09). Such a run builds the release variant unsigned
          # instead: the android job still proves the code compiles, the APK
          # cannot be mistaken for a shipable one, and every other event — a
          # push, the tag call — signs exactly as before.
          # Each build is copied aside before the next one: the two APKs come
          # out of the same output path, and the second overwrites the first.
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
              ./gradlew assembleRelease -PUNSIGNED=1
              cp app/build/outputs/apk/release/app-release-unsigned.apk tic80.apk
              ./gradlew assembleRelease -PUNSIGNED=1 -PEDITORS=OFF
              cp app/build/outputs/apk/release/app-release-unsigned.apk tic80-browser.apk
              echo "fork pull request: no repository secrets, the APKs are unsigned"
          else
              : "${RELEASE_STORE_PASSWORD:?RELEASE_STORE_PASSWORD secret is not set}"
              : "${RELEASE_KEY_PASSWORD:?RELEASE_KEY_PASSWORD secret is not set}"
              ./gradlew assembleRelease
              cp app/build/outputs/apk/release/app-release.apk tic80.apk
              ./gradlew assembleRelease -PEDITORS=OFF
              cp app/build/outputs/apk/release/app-release.apk tic80-browser.apk
          fi

        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Check what each APK carries
        run: |
          cd build/android
          # A flag that did not take looks exactly like one that took, and
          # gradle can hand the second build the first one's native library.
          # So each APK is read back: the editors APK carries the IDE, the
          # browser-only one carries the browser and no IDE.
          unzip -p tic80.apk lib/arm64-v8a/libtic80.so > editors.so
          unzip -p tic80-browser.apk lib/arm64-v8a/libtic80.so > browser.so
          if ! grep -qa "SPRITE EDITOR" editors.so; then
            echo "the APK has no editors — BUILD_EDITORS did not take" >&2
            exit 1
          fi
          if ! grep -qa "You don't have any files" browser.so; then
            echo "the browser-only APK has no browser — -PEDITORS=OFF did not take, or gradle reused the first build's library" >&2
            exit 1
          fi
          if grep -qa "SPRITE EDITOR" browser.so; then
            echo "the browser-only APK carries the editors — -PEDITORS=OFF did not take" >&2
            exit 1
          fi
          echo "both APKs carry what they should"

      - name: Deploy
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-android"
          path: build/android/tic80.apk

      - name: Deploy the browser-only APK
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-android-browser"
          path: build/android/tic80-browser.apk

  # === HTML ===
  html:
    runs-on: ubuntu-latest

    steps:
      - uses: emscripten-core/setup-emsdk@v15

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6

      - name: Install 32-bit build tools
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      # Two per-language sets come out of this job, in two artifacts, because
      # they are two different things. A game page loads the site's player,
      # which keeps its editors — ESC opens the IDE there, the way it does on
      # the universal player — while a PRO alone export hands out a build that
      # must not, so only that one is built with -DBUILD_EDITORS=OFF. The
      # site's set is staged into tic80-html-players, a directory per
      # language with the loader already renamed to the tic80.js a page asks
      # for; the stubs stay flat in tic80-html, where package.sh turns a pair
      # into html<lang> and the dev instance reads them as they are.

      # The two sets are built on different triggers, because their consumers
      # live on different clocks. The players are built on *every* trigger — a
      # branch, a pull request, main, a tag — since they are what a game page
      # loads wherever the site runs: the dev instance takes them from a main
      # push (it serves a line, 1.3, not a release), and a pull request should
      # see a broken players pass before the merge rather than after. The stubs
      # are built for the two consumers that need them and nothing else — a
      # release, whose package.sh turns a pair into html<lang>, and the dev
      # instance's export tree, which deploy-dev-stubs.sh lays out by hand from
      # a run someone names — so they keep the gate the native per-language
      # stubs have always carried: a tag, or a dispatch with `stubs`. Seven
      # minutes of emscripten a pass: a main push and a pull request pay one, a
      # release pays two.

      # The player builds run first, and take each pair back out of build/bin as
      # they stage it: the pass writes the stub names there, and on a run where
      # the stubs step below is gated off those files would otherwise ride the
      # tic80-html artifact as editorful "stubs" — the one thing the two readers
      # of the flat names (package.sh, deploy-dev-stubs.sh) must never be handed.
      # What the job leaves in build/bin is the universal trio, and the
      # editorless pairs only when the stubs step ran.

      # The editorful per-language build is a third configuration beside
      # "Build all" and the stubs, and it was the price of the owner's call
      # of 22.09 (docs/per-language-players.md, server repo): measured then, a
      # game page pays 129 KB over the wire for the IDE — 543,650 against
      # 414,333 for lua — where the universal player it replaces is 2,258,666.
      - name: Build per-language players
        shell: bash
        run: |
          set -euo pipefail
          langs=(lua ruby js moon yue fennel scheme squirrel wren wasm janet python miniscript forth)
          stage="$GITHUB_WORKSPACE/build/players"
          rm -rf "$stage"
          for lang in "${langs[@]}"; do
            flags=(-DBUILD_WITH_ALL=OFF)
            for l in "${langs[@]}"; do
              up=$(echo "$l" | tr '[:lower:]' '[:upper:]')
              if [ "$l" = "$lang" ]; then flags+=("-DBUILD_WITH_$up=ON"); else flags+=("-DBUILD_WITH_$up=OFF"); fi
            done
            cd "$GITHUB_WORKSPACE/build"
            # "Build all"'s flags with one language on: the site's player is
            # that build, thirteen runtimes lighter (BUILD_STATIC already
            # defaults to ON under emscripten, so this leaks nothing into the
            # stub pass below)
            emcmake cmake -G Ninja -DBUILD_SDLGPU=On -DBUILD_STATIC=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_EDITORS=ON "${flags[@]}" -DTIC80_TARGET="tic80$lang" ..
            cmake --build . --parallel
            for f in "bin/tic80$lang.js" "bin/tic80$lang.wasm"; do
              [ -f "$f" ] || { echo "missing player: build/$f" >&2; exit 1; }
            done
            # the loader is renamed to the name a page loads and the wasm
            # keeps the name that loader asks for — the shape the deploy
            # writes into /js/<dir>/<lang>/, produced once, here
            mkdir -p "$stage/$lang"
            cp "bin/tic80$lang.js"   "$stage/$lang/tic80.js"
            cp "bin/tic80$lang.wasm" "$stage/$lang/tic80$lang.wasm"
            # out of build/bin again, for the reason in the comment above: what
            # stays there has to be a pair only the stubs step wrote
            rm -f "bin/tic80$lang.js" "bin/tic80$lang.wasm"
          done

          # The editors are the one thing that tells the site's set from the
          # stubs, and a flag that stopped taking effect looks exactly like one
          # that took, so it is read back out of the wasm: "SPRITE EDITOR" is a
          # menu label only the editors carry, the marker package.sh checks the
          # release bundles with. The distinctness guard catches a language flag
          # that did not take, the way the stub step's does.
          files=("$stage"/{lua,ruby,js,moon,yue,fennel,scheme,squirrel,wren,wasm,janet,python,miniscript,forth}/tic80*.wasm)
          for f in "${files[@]}"; do
            if ! grep -qa "SPRITE EDITOR" "$f"; then
              echo "player without editors: $f — BUILD_EDITORS=ON did not take" >&2
              exit 1
            fi
          done
          for ((i = 0; i < ${#files[@]}; i++)); do
            for ((j = i + 1; j < ${#files[@]}; j++)); do
              if cmp -s "${files[i]}" "${files[j]}"; then
                echo "duplicate player: $(basename "${files[i]}") == $(basename "${files[j]}") — a language flag did not take" >&2
                exit 1
              fi
            done
          done
          echo "checked ${#files[@]} wasm players, all distinct, all with editors"

      # The fourteen per-language stubs the PRO alone export downloads — the
      # same work as the native jobs' loop, in one directory: no --fresh
      # between the builds, so SDL2 and whatever a language does not touch are
      # compiled once (fifteen full builds used to run here, one per language
      # plus the one below). Every language flag is spelled out on every pass,
      # which is what --fresh used to buy, and it also clears the
      # BUILD_WITH_ALL the "Build all" step leaves on when the order is
      # reversed.
      #
      # The gate is the native per-language stubs' one, and the stubs' reason is
      # the same: they are what a release packages and what the dev instance's
      # export tree is laid from by hand, so nothing a main push or a pull
      # request runs needs them — the site's pages read the players artifact
      # above instead. A dispatch with `stubs` is how a run that carries them is
      # asked for outside a release. The gate cannot change what a release
      # builds — on a tag this step runs in the same order as before.
      - name: Build per-language export stubs
        if: startsWith(github.ref, 'refs/tags/') || inputs.stubs
        shell: bash
        run: |
          set -euo pipefail
          langs=(lua ruby js moon yue fennel scheme squirrel wren wasm janet python miniscript forth)
          for lang in "${langs[@]}"; do
            flags=(-DBUILD_WITH_ALL=OFF)
            for l in "${langs[@]}"; do
              up=$(echo "$l" | tr '[:lower:]' '[:upper:]')
              if [ "$l" = "$lang" ]; then flags+=("-DBUILD_WITH_$up=ON"); else flags+=("-DBUILD_WITH_$up=OFF"); fi
            done
            cd "$GITHUB_WORKSPACE/build"
            emcmake cmake -G Ninja -DBUILD_SDLGPU=On -DCMAKE_BUILD_TYPE=Release -DBUILD_EDITORS=OFF -DBUILD_SURF=OFF "${flags[@]}" -DTIC80_TARGET="tic80$lang" ..
            cmake --build . --parallel
          done

          # An identical pair means a language flag did not take, the same guard
          # the native jobs run on their binaries: a wasm stub carries one
          # runtime, so fourteen of them cannot be alike.
          files=("$GITHUB_WORKSPACE"/build/bin/tic80{lua,ruby,js,moon,yue,fennel,scheme,squirrel,wren,wasm,janet,python,miniscript,forth}.wasm)
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then echo "missing stub: $f" >&2; exit 1; fi
          done
          for ((i = 0; i < ${#files[@]}; i++)); do
            for ((j = i + 1; j < ${#files[@]}; j++)); do
              if cmp -s "${files[i]}" "${files[j]}"; then
                echo "duplicate stub: $(basename "${files[i]}") == $(basename "${files[j]}") — a language flag did not take" >&2
                exit 1
              fi
            done
          done
          echo "checked ${#files[@]} wasm stubs, all distinct"

          # The dev instance lays these pairs out itself, so package.sh's
          # no_editors guard never runs on them there: check the content here.
          # The browser is checked too — the option defaults to on now, and a
          # job that forgets -DBUILD_SURF=OFF would ship one silently.
          for f in "${files[@]}"; do
            if grep -qa "SPRITE EDITOR" "$f"; then
              echo "stub carries the editors: $(basename "$f") — BUILD_EDITORS=OFF did not take" >&2
              exit 1
            fi
            if grep -qa "You don't have any files" "$f"; then
              echo "stub carries the browser: $(basename "$f") — BUILD_SURF=OFF did not take" >&2
              exit 1
            fi
          done

      - name: Build all
        run: |
          cd build
          emcmake cmake -G Ninja -DBUILD_SDLGPU=On -DBUILD_STATIC=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_ALL=ON .. --fresh
          cmake --build . --parallel
          # index.html is the only page: the site's player, and the page an
          # exported game gets — the client fetches it, rewrites the title
          # and the arguments marker, and adds it to the export zip with the
          # cartridge (console.c onHtmlPageGet). A second, export-only page
          # used to exist and drifted from this one.
          cp html/index.html bin/index.html

      - name: Deploy
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-html"
          path: |
            build/bin/*

      # The site's players, an artifact of their own so that nothing reads
      # them as stubs: a directory per language, the loader already named
      # tic80.js. No gate of its own — wherever the players are built they are
      # uploaded, and a run that skipped the build would fail this step's
      # if-no-files-found rather than ship an empty artifact.
      - name: Deploy players
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: error
          name: "tic80-html-players"
          path: build/players/*
