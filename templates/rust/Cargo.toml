[package]
name = "cart"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
buddy-alloc = { version = "0.6", optional = true }

[profile.release]
lto = true
strip = true
opt-level = "s"

[features]
# use `--no-default-features` or comment out next line to disable allocator
default = ["buddy-alloc"]
