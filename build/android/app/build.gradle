def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

// The version the APK reports, from git tags with the same rule as
// cmake/version.cmake: HEAD on a "vX.Y.Z" tag is that release, any other
// commit is a snapshot that keeps the last tag's major/minor and takes the
// commit count as its patch, suffixed "-dev". The tags have to be in the
// checkout (the CI jobs fetch the full history); without them the defaults
// version.cmake carries are used.
def ticRepoRoot = rootProject.projectDir.parentFile.parentFile
def ticGit = { List<String> args ->
    // ProcessBuilder rather than Project.exec: exec was removed in Gradle 9,
    // and this file is built by the wrapper's 9.0.0.
    try {
        def process = new ProcessBuilder(['git'] + args)
                .directory(ticRepoRoot)
                .redirectErrorStream(true)
                .start()
        def text = process.inputStream.getText('UTF-8')
        process.waitFor()
        process.exitValue() == 0 ? text.trim() : null
    } catch (Exception ignored) {
        null
    }
}
// A tag or a number we cannot read leaves the fallback in place; a count
// that overflows the versionCode layout would be a number of commits no
// release ever has.
def ticInt = { String text, int fallback ->
    (text != null && text ==~ /\d{1,9}/) ? (text as int) : fallback
}
def ticVersionMajor = 1
def ticVersionMinor = 2
def ticVersionPatch = 0          // the release patch — the versionCode's low part
def ticVersionShownPatch = 0     // what the name shows: the commit count for a snapshot
def ticVersionStatus = '-dev'

def ticTag = ticGit(['describe', '--tags', '--exact-match', 'HEAD'])
if (ticTag != null && ticTag ==~ /v\d{1,3}\.\d{1,3}\.\d{1,9}/) {
    def parts = ticTag.substring(1).tokenize('.')
    ticVersionMajor = parts[0] as int
    ticVersionMinor = parts[1] as int
    ticVersionShownPatch = parts[2] as int
    // Tags cut before the semver scheme carry the old commit counter as
    // their patch (v1.1.2837), which does not fit the versionCode layout:
    // those keep the major/minor slot alone, so a later release can still
    // be installed over them.
    ticVersionPatch = ticVersionShownPatch < 100 ? ticVersionShownPatch : 0
    ticVersionStatus = ''
} else {
    def lastTag = ticGit(['describe', '--tags', '--abbrev=0', 'HEAD'])
    if (lastTag != null && lastTag ==~ /v\d{1,3}\.\d{1,3}\.\d{1,9}/) {
        def parts = lastTag.substring(1).tokenize('.')
        ticVersionMajor = parts[0] as int
        ticVersionMinor = parts[1] as int
    }
    // The commit count names the snapshot but stays out of the versionCode:
    // a snapshot that outranked the release it follows would make Android
    // refuse the release over it (INSTALL_FAILED_VERSION_DOWNGRADE).
    def commitCount = ticGit(['rev-list', 'HEAD', '--count'])
    if (commitCount == null) {
        logger.warn("TIC-80: no git tags in ${ticRepoRoot}, the APK reports a snapshot version")
    }
    ticVersionShownPatch = ticInt(commitCount, 0)
}
// Android wants one integer that never goes backwards: the release numbers
// land where the old hand-kept 10200 (1.02.00) did, and a snapshot shares
// the code of the release it follows (minor and patch stay under 100).
def ticVersionCode = ticVersionMajor * 10000 + ticVersionMinor * 100 + ticVersionPatch
def ticVersionName = "${ticVersionMajor}.${ticVersionMinor}.${ticVersionShownPatch}${ticVersionStatus}"

android {
    namespace "com.nesbox.tic"
    compileSdkVersion 31
    ndkVersion "23.2.8568313"
    defaultConfig {
        if (buildAsApplication) {
            applicationId "com.nesbox.tic"
        }
        minSdkVersion 24 // Android 7.0 (Nougat)
        targetSdkVersion 31 // Android 12 (Snow Cone)
        // The manifest carries no version of its own: AGP writes these into
        // the merged one (see AndroidManifest.xml).
        versionCode ticVersionCode
        versionName ticVersionName
        ndk {
            // arm64 only: the 32-bit ARM libs doubled the APK (22 MB against
            // 13 MB) and only serve devices running a 32-bit Android.
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-31"
            }
            cmake {
                arguments "-DBUILD_WITH_RUBY=OFF",
                            "-DBUILD_PRO=OFF",
                            "-DCMAKE_BUILD_TYPE=Release",
                            "-DBUILD_WITH_ALL=ON"
            }
        }
    }

    signingConfigs {

        release {
           storeFile file(RELEASE_STORE_FILE)
           storePassword RELEASE_STORE_PASSWORD
           keyAlias RELEASE_KEY_ALIAS
           keyPassword RELEASE_KEY_PASSWORD
       }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            cmake {
                path '../../../CMakeLists.txt'
            }
        }
    }

    lint {
        abortOnError = false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar"
                    output.outputFile = new File(outputFile.parent, fileName)
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
